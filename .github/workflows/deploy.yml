name: Deploy to Hostinger via FTP

on:
  push:
    branches:
      - master
  workflow_dispatch:  # Allows manual triggering

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build Next.js project (Static Export)
        run: npm run build
        # This creates a static export in the 'out/' directory
        # Perfect for client-side only hosting (no server-side rendering)
      
      - name: Verify static export
        run: |
          echo "Checking build output..."
          ls -la out/ | head -20
      
      - name: Deploy static files to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}  # FTP server hostname only (e.g., "ftp.yourdomain.com" or "files.000webhostapp.com")
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21  # FTP port (21 is standard)
          protocol: ftp  # Use 'ftp' for standard FTP, 'ftps' for secure FTP
          local-dir: ./out/
          server-dir: /public_html/
          # Exclude build artifacts and unnecessary files
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.next/**
            **/cache/**
            **/*.map
            **/trace

